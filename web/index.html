<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rolemem</title>
<style>
  :root {
    --bg: #efe7d8;
    --ink: #1c1915;
    --muted: #6d645a;
    --card: #fbf7f0;
    --line: #e0d5c4;
    --accent: #1d6b4a;
    --accent-ink: #f3faf6;
    --warn: #8a4b12;
    --warn-bg: #f8ead7;
    --bad: #8d2f2f;
    --bad-bg: #f8e6e2;
    --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(1200px 400px at 10% -10%, #f7f1e6 0%, transparent 50%),
      var(--bg);
    font: 15px/1.5 "Avenir Next", "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  header, main { width: min(1040px, calc(100% - 32px)); margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 28px 0 18px; }
  .mark { display: flex; gap: 12px; align-items: center; }
  .mark i {
    display: grid; place-items: center; width: 36px; height: 36px;
    background: var(--ink); color: #f6f0e6; font-style: normal; font-weight: 650;
    letter-spacing: -0.04em;
  }
  h1 { font: 600 22px/1 "Iowan Old Style", Palatino, "Songti SC", serif; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--card); padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--bad); }
  button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
  button:disabled { opacity: 0.5; cursor: default; }
  input, select, textarea {
    width: 100%; border: 1px solid var(--line); background: #fff; padding: 8px 10px;
  }
  textarea { min-height: 88px; resize: vertical; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin: 8px 0 16px; flex-wrap: wrap; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #f6f0e6; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 16px; }
  .card h2 { font: 600 16px/1.3 "Iowan Old Style", Palatino, "Songti SC", serif; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  .row button { flex: 0 0 auto; }
  .memory { border-top: 1px solid var(--line); padding: 12px 0; }
  .memory:first-of-type { border-top: 0; }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; }
  .stack { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .pill { border: 1px solid var(--line); padding: 0 6px; font-size: 11px; letter-spacing: 0.02em; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .content { margin: 6px 0; white-space: pre-wrap; }
  pre, .mono { font: 12px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .key { background: #fff; border: 1px dashed var(--line); padding: 10px; margin: 8px 0; }
  .error { background: var(--bad-bg); color: var(--bad); padding: 10px 12px; margin-bottom: 12px; }
  .empty { color: var(--muted); padding: 8px 0 4px; }
  .gate { max-width: 460px; margin: 8vh auto; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #f6f0e6; padding: 8px 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: min(520px, 90vw); }
  #toast.show { opacity: 1; }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
    header { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <div class="mark">
    <i>rm</i>
    <div>
      <h1>rolemem</h1>
      <div class="sub">Long-term memory and shared work continuity.</div>
    </div>
  </div>
  <button id="lock" class="quiet" hidden>Lock</button>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
const TYPES = ["preference", "fact", "project", "procedure"];
const state = {
  token: localStorage.getItem("rolemem.token") || "",
  tab: "memories",
  loading: false,
  ready: false,
  error: "",
  memories: [],
  deletedCount: 0,
  showDeleted: false,
  deleted: [],
  connections: [],
  digest: null,
  minted: null,
  filter: { space: "", type: "", q: "" },
  editing: null,
  work: [],
  workFilter: "",
  workId: "",
  conflicts: [],
  audit: [],
};

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const toast = (text) => {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 2400);
};
const when = (iso) => {
  const date = new Date(iso);
  return Number.isNaN(date.getTime()) ? iso : date.toLocaleString();
};

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {
      ...(state.token ? { authorization: `Bearer ${state.token}` } : {}),
      ...(body === undefined ? {} : { "content-type": "application/json" }),
    },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch { data = text; } }
  if (res.status === 401) {
    state.error = "That admin token was rejected.";
    throw new Error(state.error);
  }
  if (!res.ok) throw new Error(data?.error || `Request failed (${res.status})`);
  return data;
}

async function refresh(opts = {}) {
  const focus = document.activeElement;
  const focusName = focus instanceof HTMLInputElement || focus instanceof HTMLSelectElement ? focus.name : "";
  const caret = focus instanceof HTMLInputElement ? focus.selectionStart : null;
  if (!opts.quiet) {
    state.loading = true;
    state.error = "";
    render();
  }
  try {
    const q = new URLSearchParams();
    if (state.filter.space) q.set("space", state.filter.space);
    if (state.filter.type) q.set("type", state.filter.type);
    if (state.filter.q) q.set("q", state.filter.q);
    const suffix = q.toString() ? `?${q}` : "";
    const [listed, connections, snapshot, work, conflicts, audit] = await Promise.all([
      api("GET", `/api/memories${suffix}`),
      api("GET", "/api/connections"),
      api("GET", "/api/digest"),
      api("GET", "/api/work?include_archived=1"),
      api("GET", "/api/conflicts"),
      api("GET", "/api/audit?limit=20"),
    ]);
    state.memories = listed.memories;
    state.deletedCount = listed.deleted;
    state.connections = connections.connections;
    state.digest = snapshot;
    state.work = work.work;
    state.conflicts = conflicts.conflicts;
    state.audit = audit.audit;
    if (state.showDeleted) state.deleted = (await api("GET", `/api/memories?status=deleted${suffix ? `&${q}` : ""}`)).memories;
  } catch (err) {
    state.error = err.message;
  } finally {
    state.loading = false;
    state.ready = true;
    render();
    if (focusName) {
      const next = document.querySelector(`#filters [name="${focusName}"]`);
      if (next instanceof HTMLElement) next.focus();
      if (next instanceof HTMLInputElement && caret != null) next.setSelectionRange(caret, caret);
    }
  }
}

function field(label, html) { return `<label>${esc(label)}${html}</label>`; }

function memoryCard(memory, deleted) {
  if (state.editing === memory.id && !deleted) {
    return `<form class="memory" data-edit="${esc(memory.id)}">
      ${field("Content", `<textarea name="content" required>${esc(memory.content)}</textarea>`)}
      <div class="row">
        ${field("Type", `<select name="type">${TYPES.map((type) => `<option ${type === memory.type ? "selected" : ""}>${type}</option>`).join("")}</select>`)}
        ${field("Space", `<input name="space" value="${esc(memory.space)}" required />`)}
        ${field("Source model", `<input name="source_model" value="${esc(memory.source_model || "")}" />`)}
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" type="submit">Save</button>
        <button type="button" data-cancel>Cancel</button>
      </div>
    </form>`;
  }
  const flags = memory.flags?.length ? `<span class="pill warn">${esc(memory.flags.join(", "))}</span>` : "";
  const actions = deleted ? "" : memory.status === "quarantined"
    ? `<button data-approve="${esc(memory.id)}">Approve</button><button class="danger" data-forget="${esc(memory.id)}">Delete</button>`
    : `<button data-edit-open="${esc(memory.id)}">Edit</button><button class="danger" data-forget="${esc(memory.id)}">Forget</button>`;
  return `<article class="memory">
    <div class="meta">
      <span class="pill">${esc(memory.type)}</span>
      <span class="pill">${esc(memory.space)}</span>
      ${memory.source_model ? `<span>${esc(memory.source_model)}</span>` : ""}
      <span>${esc(when(memory.updated_at))}</span>
      ${flags}
    </div>
    <p class="content">${esc(memory.content)}</p>
    <div class="row">${actions}</div>
  </article>`;
}

function workLines(title, notes) {
  if (!notes?.length) return "";
  return `<p class="meta">${esc(title)}</p><ul>${notes.map((note) => `<li>${esc(note.text)}</li>`).join("")}</ul>`;
}

function workCard(item) {
  const open = state.workId === item.id;
  const acts = {
    active: [["paused", "Pause"], ["blocked", "Block"], ["completed", "Complete"], ["archived", "Archive"]],
    paused: [["active", "Resume"], ["completed", "Complete"], ["archived", "Archive"]],
    blocked: [["active", "Resume"], ["completed", "Complete"], ["archived", "Archive"]],
    completed: [["archived", "Archive"], ["active", "Reopen"]],
    archived: [["active", "Reopen"]],
  }[item.status] || [];
  return `<article class="memory">
    <div class="meta">
      <span class="pill">${esc(item.status)}</span>
      <span class="pill">${esc(item.project)}</span>
      <span>${esc(when(item.updated_at))}</span>
      ${item.client_id ? `<span>${esc(item.client_id)}</span>` : ""}
    </div>
    <p class="content"><strong>${esc(item.title)}</strong></p>
    <p class="content">${esc(item.goal)}</p>
    ${item.progress_summary ? `<p class="content">${esc(item.progress_summary)}</p>` : ""}
    ${item.current_step ? `<p class="meta">Current step: ${esc(item.current_step)}</p>` : ""}
    ${item.next_actions?.[0] ? `<p class="meta">Next: ${esc(item.next_actions[0].text)}</p>` : `<p class="meta">Next: none recorded</p>`}
    <div class="row">
      <button type="button" data-work-open="${esc(item.id)}">${open ? "Hide detail" : "Detail"}</button>
      ${acts.map(([status, label]) => `<button type="button" data-work-act="${status}" data-work-id="${esc(item.id)}">${label}</button>`).join("")}
    </div>
    ${open ? `${workLines("Done", item.completed_steps)}${workLines("Failed", item.failed_attempts)}${workLines("Hypotheses (not facts)", item.hypotheses)}${workLines("Blockers", item.blockers)}${workLines("Open issues", item.open_issues)}${workLines("Next", item.next_actions)}${workLines("Decisions", item.key_decisions)}${item.related_memory_ids?.length ? `<p class="meta">Related memories: ${item.related_memory_ids.map((id) => esc(id.slice(0, 8))).join(", ")}</p>` : ""}${item.flags?.length ? `<p class="meta"><span class="pill warn">${esc(item.flags.join(", "))}</span></p>` : ""}` : ""}
  </article>`;
}

function render() {
  document.getElementById("lock").hidden = !state.token;
  const app = document.getElementById("app");
  if (!state.token) {
    app.innerHTML = `<section class="card gate">
      <h2>Open the archive</h2>
      <p>This server has one admin token and no accounts. Paste the token from <span class="mono">ROLEMEM_ADMIN_TOKEN</span> or the server log.</p>
      <form id="login">
        ${field("Admin token", `<input name="token" type="password" autocomplete="current-password" required />`)}
        <div class="row" style="margin-top:10px"><button class="primary" type="submit">Unlock</button></div>
        <p class="empty" id="health">Checking the server…</p>
      </form>
      ${state.error ? `<div class="error">${esc(state.error)}</div>` : ""}
    </section>`;
    fetch("/healthz").then((res) => res.json()).then((data) => {
      const el = document.getElementById("health");
      if (el) el.textContent = data.ok ? `Server is up, version ${data.version}.` : "Server health check failed.";
    }).catch(() => {
      const el = document.getElementById("health");
      if (el) el.textContent = "Can't reach the server.";
    });
    return;
  }

  const active = state.memories.filter((memory) => memory.status === "active");
  const quarantined = state.memories.filter((memory) => memory.status === "quarantined");
  const spaces = [...new Set(state.memories.map((memory) => memory.space).concat(["work", "life"]))].sort();
  app.innerHTML = `
    <nav class="tabs">
      ${[["memories", "Memories"], ["work", "Work"], ["transfer", "Import / export"], ["connections", "Connections"]].map(([tab, label]) => `<button type="button" data-tab="${tab}" aria-selected="${state.tab === tab}">${label}</button>`).join("")}
    </nav>
    ${state.error ? `<div class="error">${esc(state.error)}</div>` : ""}
    ${state.loading && !state.ready ? `<p class="empty">Loading the archive…</p>` : ""}
    <section data-panel="memories" ${state.tab === "memories" ? "" : "hidden"}>
      <div class="grid">
        <div class="card">
          <h2>Teach a memory</h2>
          <form id="add">
            ${field("Content", `<textarea name="content" required placeholder="One sentence another model should still know next month."></textarea>`)}
            <div class="row">
              ${field("Type", `<select name="type">${TYPES.map((type) => `<option ${type === "fact" ? "selected" : ""}>${type}</option>`).join("")}</select>`)}
              ${field("Space", `<input name="space" list="spaces" value="life" required /><datalist id="spaces">${spaces.map((space) => `<option value="${esc(space)}"></option>`).join("")}</datalist>`)}
              ${field("Source model", `<input name="source_model" placeholder="optional" />`)}
            </div>
            <div class="row" style="margin-top:10px"><button class="primary" type="submit">Remember</button></div>
          </form>
          <form id="filters" class="row" style="margin-top:16px">
            ${field("Space", `<select name="space"><option value="">All spaces</option>${spaces.map((space) => `<option ${space === state.filter.space ? "selected" : ""}>${esc(space)}</option>`).join("")}</select>`)}
            ${field("Type", `<select name="type"><option value="">All types</option>${TYPES.map((type) => `<option ${type === state.filter.type ? "selected" : ""}>${type}</option>`).join("")}</select>`)}
            ${field("Search", `<input name="q" value="${esc(state.filter.q)}" placeholder="Find a phrase" />`)}
          </form>
          ${quarantined.length ? `<div class="card" style="margin-top:12px;background:var(--warn-bg)"><h2>Quarantine · ${quarantined.length}</h2><p class="empty">These came from a model or a paste and look like instructions. They are not in the digest.</p>${quarantined.map((memory) => memoryCard(memory)).join("")}<div class="row"><button data-bulk="approve">Approve all</button><button class="danger" data-bulk="delete">Delete all</button></div></div>` : ""}
          ${state.conflicts.length ? `<div class="card" style="margin-top:12px"><h2>Content replacements · ${state.conflicts.length}</h2><p class="empty">A newer edit or import replaced the text. The previous wording is kept here. The active row is the newer one.</p>${state.conflicts.slice(0, 5).map((row) => `<article class="memory"><p class="meta">${esc(row.resolution)} · ${esc(when(row.created_at))}</p><p class="content">${esc(row.old_content)}</p><p class="meta">newer</p><p class="content">${esc(row.new_content)}</p></article>`).join("")}</div>` : ""}
          <div style="margin-top:8px">
            ${active.length ? active.map((memory) => memoryCard(memory)).join("") : state.loading ? "" : `<p class="empty">Nothing stored${state.filter.q || state.filter.space || state.filter.type ? " for this filter" : ""}. Teach a fact above, or import a JSON export.</p>`}
          </div>
          <p class="meta" style="margin-top:8px">${state.deletedCount} deleted marker${state.deletedCount === 1 ? "" : "s"} kept so old exports cannot bring them back. <button class="quiet" id="toggle-deleted" type="button">${state.showDeleted ? "Hide" : "Show"}</button></p>
          ${state.showDeleted ? state.deleted.map((memory) => memoryCard(memory, true)).join("") || `<p class="empty">No deleted markers.</p>` : ""}
        </div>
        <aside class="card">
          <h2>What models receive</h2>
          <p class="empty">${state.digest ? `${esc(state.digest.mode)} · ${state.digest.included} of ${state.digest.total}` : "The session digest loads with the archive."}</p>
          <pre>${esc(state.digest?.text || "")}</pre>
        </aside>
      </div>
    </section>
    <section class="card" data-panel="work" ${state.tab === "work" ? "" : "hidden"}>
      <h2>Work continuity</h2>
      <p>This is the shared task, not the long-term memory and not a chat transcript. Connecting a client does not capture messages. Hypotheses stay separate from recorded facts.</p>
      <form id="work-add">
        <div class="row">
          ${field("Project", `<input name="project" required placeholder="rolemem" />`)}
          ${field("Title", `<input name="title" required placeholder="What is in progress" />`)}
        </div>
        ${field("Goal", `<textarea name="goal" required placeholder="One goal another client can continue."></textarea>`)}
        <div class="row" style="margin-top:8px"><button class="primary" type="submit">Start work</button></div>
      </form>
      <form id="work-filter" class="row" style="margin-top:16px">
        ${field("Status", `<select name="status"><option value="" ${state.workFilter === "" ? "selected" : ""}>Open and completed</option>${["active", "paused", "blocked", "completed", "archived"].map((status) => `<option value="${status}" ${state.workFilter === status ? "selected" : ""}>${status}</option>`).join("")}</select>`)}
      </form>
      ${(() => {
        const shown = state.work.filter((item) => state.workFilter ? item.status === state.workFilter : item.status !== "archived");
        if (!shown.length) return `<p class="empty">${state.loading ? "" : "No work items for this filter. Start one above, or from start_work in a client."}</p>`;
        return shown.map(workCard).join("");
      })()}
      <h2 style="margin-top:18px">Recent audit</h2>
      ${state.audit.length ? state.audit.map((row) => `<p class="stack">${esc(when(row.at))} · ${esc(row.action)} · ${esc(row.target || "")} · ${esc(row.detail || "")}</p>`).join("") : `<p class="empty">No audit rows yet.</p>`}
    </section>
    <section class="card" data-panel="transfer" ${state.tab === "transfer" ? "" : "hidden"}>
      <h2>Move the archive</h2>
      <p>JSON is the lossless file: version, memories, and a sha256. Re-importing it into an empty server restores the same rows, including deletes. Markdown is the same fields in a form you can read. Paste still accepts a ChatGPT, Claude, or Gemini memory export.</p>
      <div class="row">
        <button class="primary" id="download-json" type="button">Download JSON</button>
        <button id="download-md" type="button">Download Markdown</button>
        <button id="download-paste" type="button">Download paste text</button>
      </div>
      <form id="import-file" style="margin-top:16px">
        ${field("JSON or Markdown file", `<input name="file" type="file" accept="application/json,text/markdown,.json,.md,.txt" required />`)}
        <div class="row" style="margin-top:8px"><button class="primary" type="submit">Import file</button></div>
      </form>
      <form id="import-paste" style="margin-top:16px">
        ${field("Pasted memories", `<textarea name="text" placeholder="[2026-10-01] - One memory per line" required></textarea>`)}
        <div class="row">
          ${field("Source", `<select name="source"><option>chatgpt</option><option>claude</option><option>gemini</option><option>other</option><option>markdown</option></select>`)}
          ${field("Space", `<input name="space" value="life" />`)}
          ${field("Type", `<select name="type">${TYPES.map((type) => `<option>${type}</option>`).join("")}</select>`)}
        </div>
        <div class="row" style="margin-top:8px"><button type="submit">Import text</button></div>
      </form>
    </section>
    <section class="card" data-panel="connections" ${state.tab === "connections" ? "" : "hidden"}>
      <h2>Connection keys</h2>
      <p>Each key lets one MCP client read and write this archive. The server stores only a hash. Prefer an Authorization header. A key inside the URL can land in proxy logs.</p>
      <form id="mint" class="row">
        ${field("Label", `<input name="label" placeholder="Cursor" required />`)}
        <button class="primary" type="submit">Mint key</button>
      </form>
      ${state.minted ? `<div class="key"><div class="meta">Shown once. Copy it now.</div><pre id="minted-key">${esc(state.minted.key)}</pre>
        <div class="meta">Cursor</div><pre>${esc(state.minted.snippets.cursor)}</pre>
        <div class="meta">Codex</div><pre>${esc(state.minted.snippets.codex)}</pre>
        <div class="meta">Claude Code</div><pre>${esc(state.minted.snippets.claudeCode)}</pre>
        <div class="meta">URL fallback, treat as a password</div><pre>${esc(state.minted.snippets.url)}</pre>
      </div>` : ""}
      ${state.connections.length ? state.connections.map((connection) => `<article class="memory">
        <div class="meta"><strong>${esc(connection.label)}</strong><span>${esc(when(connection.created_at))}</span>${connection.last_used_at ? `<span>last used ${esc(when(connection.last_used_at))}</span>` : `<span>not used yet</span>`}</div>
        <button class="danger" data-revoke="${esc(connection.id)}">Revoke</button>
      </article>`).join("") : `<p class="empty">No keys yet. Cursor, Claude Code, and Codex can share this store once one is minted.</p>`}
    </section>
  `;
}

document.getElementById("lock").addEventListener("click", () => {
  localStorage.removeItem("rolemem.token");
  state.token = "";
  state.minted = null;
  state.error = "";
  render();
});

document.getElementById("app").addEventListener("submit", async (event) => {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  event.preventDefault();
  const data = new FormData(form);
  try {
    if (form.id === "login") {
      state.token = String(data.get("token") || "").trim();
      localStorage.setItem("rolemem.token", state.token);
      await refresh();
      if (state.error) {
        localStorage.removeItem("rolemem.token");
        state.token = "";
        render();
      }
      return;
    }
    if (form.id === "add") {
      await api("POST", "/api/memories", {
        content: data.get("content"),
        type: data.get("type"),
        space: data.get("space"),
        source_model: data.get("source_model") || null,
      });
      toast("Remembered");
      await refresh();
      return;
    }
    if (form.dataset.edit) {
      await api("PATCH", `/api/memories/${form.dataset.edit}`, {
        content: data.get("content"),
        type: data.get("type"),
        space: data.get("space"),
        source_model: data.get("source_model") || null,
      });
      state.editing = null;
      toast("Updated");
      await refresh();
      return;
    }
    if (form.id === "import-file") {
      const file = data.get("file");
      const text = await file.text();
      const isJson = file.name.endsWith(".json") || text.trim().startsWith("{");
      const result = isJson
        ? await api("POST", "/api/import", { document: JSON.parse(text) })
        : await api("POST", "/api/import", { source: "markdown", text });
      toast(`Imported: ${result.added} added, ${result.updated} updated, ${result.deleted} deleted, ${result.skipped} unchanged`);
      await refresh();
      return;
    }
    if (form.id === "import-paste") {
      const result = await api("POST", "/api/import", {
        source: data.get("source"),
        text: data.get("text"),
        space: data.get("space"),
        type: data.get("type"),
      });
      toast(`Imported: ${result.added} added, ${result.quarantined} quarantined, ${result.skipped} unchanged`);
      state.tab = "memories";
      await refresh();
      return;
    }
    if (form.id === "work-add") {
      await api("POST", "/api/work", {
        project: data.get("project"),
        title: data.get("title"),
        goal: data.get("goal"),
        client_id: "admin",
      });
      toast("Work started");
      state.tab = "work";
      await refresh();
      return;
    }
    if (form.id === "mint") {
      state.minted = await api("POST", "/api/connections", { label: data.get("label") });
      toast("Key minted. It will not be shown again.");
      await refresh();
      state.minted = state.minted;
      render();
    }
  } catch (err) {
    state.error = err.message;
    toast(err.message);
    render();
  }
});

document.getElementById("app").addEventListener("click", async (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.tab) { state.tab = button.dataset.tab; render(); return; }
  if (button.dataset.cancel !== undefined || button.id === "cancel") { state.editing = null; render(); return; }
  if (button.dataset.editOpen) { state.editing = button.dataset.editOpen; render(); return; }
  try {
    if (button.dataset.forget) {
      if (!confirm("Forget this memory? A deleted marker stays so an old export cannot restore it.")) return;
      await api("DELETE", `/api/memories/${button.dataset.forget}`);
      toast("Forgotten");
      await refresh();
    } else if (button.dataset.approve) {
      await api("POST", `/api/memories/${button.dataset.approve}/approve`);
      toast("Approved");
      await refresh();
    } else if (button.dataset.bulk) {
      await api("POST", "/api/quarantine", { action: button.dataset.bulk });
      toast(button.dataset.bulk === "approve" ? "Quarantine approved" : "Quarantine deleted");
      await refresh();
    } else if (button.dataset.revoke) {
      if (!confirm("Revoke this key? The client will lose access immediately.")) return;
      await api("DELETE", `/api/connections/${button.dataset.revoke}`);
      toast("Revoked");
      await refresh();
    } else if (button.dataset.workOpen) {
      state.workId = state.workId === button.dataset.workOpen ? "" : button.dataset.workOpen;
      render();
      return;
    } else if (button.dataset.workAct) {
      const act = button.dataset.workAct;
      if ((act === "completed" || act === "archived") && !confirm(act === "archived" ? "Archive this work item?" : "Mark this work item completed?")) return;
      if (act === "completed") await api("POST", `/api/work/${button.dataset.workId}/complete`, {});
      else if (act === "archived") await api("POST", `/api/work/${button.dataset.workId}/complete`, { archive: true });
      else await api("PATCH", `/api/work/${button.dataset.workId}`, { status: act });
      toast("Work updated");
      await refresh();
    } else if (button.id === "toggle-deleted") {
      state.showDeleted = !state.showDeleted;
      await refresh();
    } else if (button.id?.startsWith("download-")) {
      const format = button.id === "download-json" ? "json" : button.id === "download-md" ? "markdown" : "paste";
      const res = await fetch(`/api/export?format=${format}`, { headers: { authorization: `Bearer ${state.token}` } });
      if (!res.ok) throw new Error("Export failed");
      const blob = await res.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = format === "json" ? "rolemem-memories.json" : format === "markdown" ? "rolemem-memories.md" : "rolemem-memories.txt";
      link.click();
    }
  } catch (err) {
    toast(err.message);
  }
});

document.getElementById("app").addEventListener("input", (event) => {
  const form = event.target.form;
  if (!form || (form.id !== "filters" && form.id !== "work-filter")) return;
  if (form.id === "work-filter") {
    state.workFilter = String(new FormData(form).get("status") || "");
    render();
    return;
  }
  const data = new FormData(form);
  state.filter = { space: String(data.get("space") || ""), type: String(data.get("type") || ""), q: String(data.get("q") || "") };
  clearTimeout(render.filterTimer);
  render.filterTimer = setTimeout(() => refresh({ quiet: true }), 200);
});

if (state.token) refresh();
else render();
</script>
</body>
</html>
